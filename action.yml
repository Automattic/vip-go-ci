name: 'vip-go-ci'
description: 'Scan pull requests with vip-go-ci: PHP linting, PHPCS, SVG and WPScan API scanning, and auto-approvals.'
author: 'Automattic'
branding:
  icon: 'check-circle'
  color: 'blue'

# Defaults mirror the configuration of the WordPress VIP Code Analysis Bot,
# minus features that depend on VIP-internal services. Any vip-go-ci option
# not exposed as an input can be passed via `extra-options`.
inputs:
  github-token:
    description: 'Token used to communicate with GitHub. GITHUB_TOKEN works; feedback is then posted as github-actions[bot].'
    default: ${{ github.token }}
  comment-marker:
    description: 'ID of the hidden marker added to feedback, used to identify feedback posted by this action. Empty disables the marker.'
    default: 'github-actions'
  name-to-use:
    description: 'Name used for the bot in comments and reviews.'
    default: 'vip-go-ci'
  informational-msg:
    description: 'Message appended to comments and reviews posted.'
    default: ''
  lint-php-version:
    description: 'PHP version to lint and PHPCS-check compatibility against (e.g. 8.2).'
    default: '8.2'
  runtime-php-version:
    description: 'PHP version used to run vip-go-ci, PHPCS and the SVG scanner. Must be 8.2 or newer.'
    default: '8.3'
  lint:
    description: 'Whether to PHP lint changed files.'
    default: 'true'
  phpcs:
    description: 'Whether to run PHPCS on changed files.'
    default: 'true'
  phpcs-standard:
    description: 'PHPCS standards to use, comma separated.'
    default: 'WordPress-VIP-Go,PHPCompatibilityWP'
  phpcs-severity:
    description: 'Minimum PHPCS severity to report.'
    default: '1'
  phpcs-sniffs-exclude:
    description: 'PHPCS sniffs to exclude, comma separated.'
    default: 'Generic.PHP.Syntax'
  svg-checks:
    description: 'Whether to scan changed SVG files.'
    default: 'true'
  autoapprove:
    description: 'Whether to auto-approve pull requests that only change auto-approvable files. With GITHUB_TOKEN, requires "Allow GitHub Actions to create and approve pull requests" to be enabled for the repository.'
    default: 'false'
  autoapprove-filetypes:
    description: 'File extensions that can be auto-approved, comma separated.'
    default: 'css,csv,eot,gif,gz,ico,ini,jpeg,jpg,json,less,lock,map,md,mdown,mo,mp4,otf,pcss,pdf,po,pot,png,sass,scss,styl,ttf,txt,woff,woff2,yaml,yml'
  autoapprove-label:
    description: 'Label added to auto-approved pull requests.'
    default: '[Status] VIP Auto Approved'
  autoapprove-php-nonfunctional-changes:
    description: 'Whether to auto-approve PHP files with only whitespace or comment changes.'
    default: 'true'
  dismiss-stale-reviews:
    description: 'Whether to dismiss earlier reviews whose comments are all obsolete.'
    default: 'true'
  skip-draft-prs:
    description: 'Whether to skip draft pull requests.'
    default: 'false'
  review-comments-max:
    description: 'Maximum number of inline comments per review.'
    default: '18'
  review-comments-total-max:
    description: 'Maximum number of active inline comments per pull request.'
    default: '100'
  support-comment:
    description: 'Support message posted once to each pull request. Empty disables it.'
    default: ''
  support-comment-branches:
    description: 'Target branches to post the support message to, comma separated, or "any".'
    default: 'any'
  support-comment-skip-label:
    description: 'Do not post the support message to pull requests with this label.'
    default: ''
  wpscan-api-token:
    description: 'WPScan API token. WPScan scanning is enabled when set.'
    default: ''
  wpscan-api-paths:
    description: 'Directories, relative to the repository root, containing plugins and themes to scan with WPScan.'
    default: 'plugins,client-mu-plugins,themes'
  wpscan-api-report-end-msg:
    description: 'Message appended to WPScan reports.'
    default: ''
  max-exec-time:
    description: 'Maximum execution time in seconds.'
    default: '720'
  repo-options-allowed:
    description: 'Options that may be overridden by a .vipgoci_options file in the repository, comma separated. Empty disables the file.'
    default: 'skip-execution,skip-draft-prs,lint-modified-files-only,phpcs,phpcs-severity,phpcs-sniffs-include,phpcs-sniffs-exclude,report-no-issues-found,review-comments-sort,review-comments-include-severity,post-generic-pr-support-comments,scan-details-msg-include,svg-checks,autoapprove,autoapprove-php-nonfunctional-changes'
  skip-codebase-manager-prs:
    description: 'Whether to skip pull requests opened by the VIP Codebase Manager (branches starting with vip/codebase_manager/).'
    default: 'true'
  fail-on-issues:
    description: 'Whether to fail the step when errors are found in the code.'
    default: 'true'
  checkout:
    description: 'Whether to check out the pull request head commit with full history. When false, the caller must do so.'
    default: 'true'
  extra-options:
    description: 'Additional vip-go-ci command-line options, one per line (e.g. --phpcs-skip-folders=plugins). These take precedence over the inputs above.'
    default: ''

outputs:
  result:
    description: 'Outcome of the scan: success, issues, skipped or error.'
    value: ${{ steps.run.outputs.result || steps.prepare.outputs.result }}
  exit-code:
    description: 'Exit code of vip-go-ci, empty when the scan was skipped before running.'
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Prepare
      id: prepare
      shell: bash
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        SKIP_CCM: ${{ inputs.skip-codebase-manager-prs }}
      run: |
        if [ "$RUNNER_OS" != "Linux" ] ; then
          echo "::error::vip-go-ci action only supports Linux runners"
          exit 1
        fi

        skip="false"

        if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] ; then
          echo "::notice::Skipping vip-go-ci: pull requests from forks cannot be commented on with a read-only token"
          skip="true"
        elif [ "$SKIP_CCM" == "true" ] && [[ "$HEAD_REF" == vip/codebase_manager/* ]] ; then
          echo "::notice::Skipping vip-go-ci: pull request was opened by the VIP Codebase Manager"
          skip="true"
        fi

        {
          echo "skip=$skip"
          echo "commit=${HEAD_SHA:-$GITHUB_SHA}"
          echo "tools-key=vip-go-ci-tools-$RUNNER_OS-$(sha256sum "$GITHUB_ACTION_PATH/tools-init.sh" | cut -c1-16)"
          if [ "$skip" == "true" ] ; then
            echo "result=skipped"
          fi
        } >> "$GITHUB_OUTPUT"

    # vip-go-ci requires the local repository to be at the commit scanned,
    # with enough history to diff against the pull request base.
    - name: Check out pull request head
      if: steps.prepare.outputs.skip != 'true' && inputs.checkout == 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.prepare.outputs.commit }}
        fetch-depth: 0

    - name: Set up PHP ${{ inputs.lint-php-version }} (linting)
      if: steps.prepare.outputs.skip != 'true'
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.lint-php-version }}
        coverage: none

    # Installed last so it becomes the default PHP.
    - name: Set up PHP ${{ inputs.runtime-php-version }} (vip-go-ci runtime)
      if: steps.prepare.outputs.skip != 'true'
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.runtime-php-version }}
        coverage: none

    - name: Restore vip-go-ci tools
      id: tools-cache
      if: steps.prepare.outputs.skip != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/vip-go-ci-tools
        key: ${{ steps.prepare.outputs.tools-key }}

    # Installs PHPCS, coding standards and the SVG scanner at the versions
    # pinned by this vip-go-ci version. Only run on a cache miss, as the script
    # exits with an error when the tools exist and it skips its update check.
    - name: Install vip-go-ci tools
      if: steps.prepare.outputs.skip != 'true' && steps.tools-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd "$(mktemp -d)" || exit 1
        bash "$GITHUB_ACTION_PATH/tools-init.sh"
        test -x ~/vip-go-ci-tools/phpcs/bin/phpcs

    - name: Save vip-go-ci tools
      if: steps.prepare.outputs.skip != 'true' && steps.tools-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/vip-go-ci-tools
        key: ${{ steps.prepare.outputs.tools-key }}

    - name: Run vip-go-ci
      id: run
      if: steps.prepare.outputs.skip != 'true'
      shell: bash
      env:
        COMMIT: ${{ steps.prepare.outputs.commit }}
        CHECKOUT: ${{ inputs.checkout }}
        IN_TOKEN: ${{ inputs.github-token }}
        IN_COMMENT_MARKER: ${{ inputs.comment-marker }}
        IN_NAME_TO_USE: ${{ inputs.name-to-use }}
        IN_INFORMATIONAL_MSG: ${{ inputs.informational-msg }}
        IN_LINT_PHP_VERSION: ${{ inputs.lint-php-version }}
        IN_RUNTIME_PHP_VERSION: ${{ inputs.runtime-php-version }}
        IN_LINT: ${{ inputs.lint }}
        IN_PHPCS: ${{ inputs.phpcs }}
        IN_PHPCS_STANDARD: ${{ inputs.phpcs-standard }}
        IN_PHPCS_SEVERITY: ${{ inputs.phpcs-severity }}
        IN_PHPCS_SNIFFS_EXCLUDE: ${{ inputs.phpcs-sniffs-exclude }}
        IN_SVG_CHECKS: ${{ inputs.svg-checks }}
        IN_AUTOAPPROVE: ${{ inputs.autoapprove }}
        IN_AUTOAPPROVE_FILETYPES: ${{ inputs.autoapprove-filetypes }}
        IN_AUTOAPPROVE_LABEL: ${{ inputs.autoapprove-label }}
        IN_AUTOAPPROVE_PHP_NONFUNCTIONAL_CHANGES: ${{ inputs.autoapprove-php-nonfunctional-changes }}
        IN_DISMISS_STALE_REVIEWS: ${{ inputs.dismiss-stale-reviews }}
        IN_SKIP_DRAFT_PRS: ${{ inputs.skip-draft-prs }}
        IN_REVIEW_COMMENTS_MAX: ${{ inputs.review-comments-max }}
        IN_REVIEW_COMMENTS_TOTAL_MAX: ${{ inputs.review-comments-total-max }}
        IN_SUPPORT_COMMENT: ${{ inputs.support-comment }}
        IN_SUPPORT_COMMENT_BRANCHES: ${{ inputs.support-comment-branches }}
        IN_SUPPORT_COMMENT_SKIP_LABEL: ${{ inputs.support-comment-skip-label }}
        IN_WPSCAN_API_TOKEN: ${{ inputs.wpscan-api-token }}
        IN_WPSCAN_API_PATHS: ${{ inputs.wpscan-api-paths }}
        IN_WPSCAN_API_REPORT_END_MSG: ${{ inputs.wpscan-api-report-end-msg }}
        IN_MAX_EXEC_TIME: ${{ inputs.max-exec-time }}
        IN_REPO_OPTIONS_ALLOWED: ${{ inputs.repo-options-allowed }}
        IN_FAIL_ON_ISSUES: ${{ inputs.fail-on-issues }}
        IN_EXTRA_OPTIONS: ${{ inputs.extra-options }}
      run: |
        set -uo pipefail

        if [ "$CHECKOUT" != "true" ] && [ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" != "$COMMIT" ] ; then
          echo "::error::The workspace must be checked out at $COMMIT, with full history, when the checkout input is false"
          exit 1
        fi

        # Options are passed via the environment, using --env-options, so
        # that values such as tokens are not visible in the process list.
        env_options=()

        set_option() {
          local name="$1"
          local var

          var="VIPGOCI_$(echo "$name" | tr 'a-z-' 'A-Z_')"

          export "$var=$2"
          env_options+=( "$name=$var" )
        }

        php_bin="/usr/bin/php$IN_RUNTIME_PHP_VERSION"

        set_option repo-owner "${GITHUB_REPOSITORY%%/*}"
        set_option repo-name "${GITHUB_REPOSITORY#*/}"
        set_option commit "$COMMIT"
        set_option token "$IN_TOKEN"
        set_option name-to-use "$IN_NAME_TO_USE"
        set_option max-exec-time "$IN_MAX_EXEC_TIME"
        set_option skip-draft-prs "$IN_SKIP_DRAFT_PRS"
        set_option skip-large-files "true"
        set_option skip-large-files-limit "30000"
        set_option scan-details-msg-include "true"

        if [ -n "$IN_COMMENT_MARKER" ] ; then
          set_option comment-marker "$IN_COMMENT_MARKER"
        fi

        if [ -n "$IN_INFORMATIONAL_MSG" ] ; then
          set_option informational-msg "$IN_INFORMATIONAL_MSG"
        fi

        if [ -n "$IN_REPO_OPTIONS_ALLOWED" ] ; then
          set_option repo-options "true"
          set_option repo-options-allowed "$IN_REPO_OPTIONS_ALLOWED"
        fi

        # PHP linting.
        set_option lint "$IN_LINT"
        set_option lint-php-versions "$IN_LINT_PHP_VERSION"
        set_option lint-php-version-paths "$IN_LINT_PHP_VERSION:/usr/bin/php$IN_LINT_PHP_VERSION"
        set_option lint-skip-folders-in-repo-options-file "true"

        # PHPCS.
        set_option phpcs "$IN_PHPCS"
        set_option phpcs-path "$HOME/vip-go-ci-tools/phpcs/bin/phpcs"
        set_option phpcs-php-path "$php_bin"
        set_option phpcs-standard "$IN_PHPCS_STANDARD"
        set_option phpcs-standards-to-ignore "PHPCSUtils"
        set_option phpcs-severity "$IN_PHPCS_SEVERITY"
        set_option phpcs-runtime-set "testVersion $IN_LINT_PHP_VERSION-"
        set_option phpcs-skip-folders-in-repo-options-file "true"
        set_option phpcs-skip-scanning-via-labels-allowed "true"

        if [ -n "$IN_PHPCS_SNIFFS_EXCLUDE" ] ; then
          set_option phpcs-sniffs-exclude "$IN_PHPCS_SNIFFS_EXCLUDE"
        fi

        # SVG scanning.
        set_option svg-checks "$IN_SVG_CHECKS"
        set_option svg-scanner-path "$HOME/vip-go-ci-tools/vip-go-svg-sanitizer/svg-scanner.php"
        set_option svg-php-path "$php_bin"

        # Auto-approvals.
        set_option autoapprove "$IN_AUTOAPPROVE"

        if [ "$IN_AUTOAPPROVE" == "true" ] ; then
          set_option autoapprove-filetypes "$IN_AUTOAPPROVE_FILETYPES"
          set_option autoapprove-label "$IN_AUTOAPPROVE_LABEL"
          set_option autoapprove-php-nonfunctional-changes "$IN_AUTOAPPROVE_PHP_NONFUNCTIONAL_CHANGES"
        fi

        # Reviews and comments.
        set_option report-no-issues-found "true"
        set_option review-comments-max "$IN_REVIEW_COMMENTS_MAX"
        set_option review-comments-total-max "$IN_REVIEW_COMMENTS_TOTAL_MAX"
        set_option review-comments-ignore "File appears to be minified and cannot be processed"
        set_option review-comments-include-severity "true"
        set_option review-comments-sort "true"
        set_option dismiss-stale-reviews "$IN_DISMISS_STALE_REVIEWS"
        set_option dismissed-reviews-repost-comments "true"

        # Generic support comment.
        if [ -n "$IN_SUPPORT_COMMENT" ] ; then
          set_option post-generic-pr-support-comments "true"
          set_option post-generic-pr-support-comments-string "1:$IN_SUPPORT_COMMENT"
          set_option post-generic-pr-support-comments-branches "1:$IN_SUPPORT_COMMENT_BRANCHES"
          set_option post-generic-pr-support-comments-on-drafts "1:false"

          if [ -n "$IN_SUPPORT_COMMENT_SKIP_LABEL" ] ; then
            set_option post-generic-pr-support-comments-skip-if-label-exists "1:$IN_SUPPORT_COMMENT_SKIP_LABEL"
          fi
        fi

        # WPScan API.
        if [ -n "$IN_WPSCAN_API_TOKEN" ] ; then
          set_option wpscan-api "true"
          set_option wpscan-api-dry-mode "false"
          set_option wpscan-api-token "$IN_WPSCAN_API_TOKEN"
          set_option wpscan-api-paths "$IN_WPSCAN_API_PATHS"

          if [ -n "$IN_WPSCAN_API_REPORT_END_MSG" ] ; then
            set_option wpscan-api-report-end-msg "$IN_WPSCAN_API_REPORT_END_MSG"
          fi
        fi

        # Extra options, one per line. Command-line options take precedence.
        extra_options=()

        while IFS= read -r line ; do
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"

          if [ -n "$line" ] ; then
            extra_options+=( "$line" )
          fi
        done <<< "$IN_EXTRA_OPTIONS"

        # Composite steps run with -e; capture the exit code instead.
        set +e

        "$php_bin" "$GITHUB_ACTION_PATH/vip-go-ci.php" \
          --local-git-repo="$GITHUB_WORKSPACE" \
          --env-options="$(IFS=, ; echo "${env_options[*]}")" \
          "${extra_options[@]}"

        exit_code=$?

        case "$exit_code" in
          0)
            result="success"
            ;;
          250)
            result="issues"
            ;;
          230)
            echo "::notice::vip-go-ci skipped scanning: commit $COMMIT is not part of an open pull request"
            result="skipped"
            ;;
          248)
            echo "::notice::vip-go-ci skipped scanning: commit $COMMIT is not the latest in the pull request"
            result="skipped"
            ;;
          *)
            result="error"
            ;;
        esac

        {
          echo "result=$result"
          echo "exit-code=$exit_code"
        } >> "$GITHUB_OUTPUT"

        if [ "$result" == "error" ] ; then
          echo "::error::vip-go-ci exited with code $exit_code"
          exit "$exit_code"
        elif [ "$result" == "issues" ] && [ "$IN_FAIL_ON_ISSUES" == "true" ] ; then
          echo "::error::vip-go-ci found errors in the code"
          exit "$exit_code"
        fi
